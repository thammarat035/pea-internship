name: Backend Tests

on:
  push:
    branches: [main]
    paths:
      - "backend-main/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend-main/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-main

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun scripts/test-all.ts src
